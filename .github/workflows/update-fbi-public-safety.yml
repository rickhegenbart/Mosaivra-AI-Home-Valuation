name: Update FBI Public Safety

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 15 * *"

permissions:
  contents: read

concurrency:
  group: update-fbi-public-safety
  cancel-in-progress: false

jobs:
  update-fbi-public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FBI_API_KEY: ${{ secrets.FBI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate pipeline syntax
        run: python -m py_compile pipeline/update_fbi_public_safety.py

      - name: Update FBI public-safety indicators
        run: python -m pipeline.update_fbi_public_safety